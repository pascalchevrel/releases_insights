name: REO regression action required Slack summary

on:
  schedule:
    # Runs every weekday at 12:00 UTC (5am Pacific / 8am Eastern / 1pm BST)
    - cron: '0 12 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print the message instead of posting it to Slack'
        required: false
        type: boolean
        default: false

jobs:
  summarise-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Summarise the regressions needing action and post to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.REO_SLACK_WEBHOOK }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python3 app/scripts/reo_regression_slack_summary.py --daily
